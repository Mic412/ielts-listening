<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Listening Practice</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b4b8f"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef1f5;--fg:#14202b;--card:#fff;--ac:#1b4b8f;--mu:#5c6b7a;--bd:#c9d2dc;--ok:#1e7a3c;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10171f;--fg:#e6ecf2;--card:#1a232d;--ac:#6ea2ee;--mu:#93a1b0;--bd:#33414f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0}h2{margin:.4em 0}h3,h4{margin:1em 0 .3em}
button{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:var(--ac);color:var(--bg);cursor:pointer}
button:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.c{background:var(--card);color:var(--fg);border:1px dashed var(--bd);border-radius:8px;padding:14px;display:flex;flex-direction:column;text-align:left;opacity:.55}
.c small{color:var(--mu)}
.c.on{opacity:1;border:2px solid var(--ac)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--ac);color:var(--bg);z-index:2;font-weight:600}
.q{margin:16px 0}
.pn{display:flex;justify-content:space-between;margin-top:24px}
.chip{display:inline-block;margin:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;user-select:none}
.chip.sel{outline:3px solid var(--ac)}.chip.used{opacity:.4}
.slot{display:inline-block;min-width:56px;text-align:center;margin-left:8px;padding:6px 10px;border:2px dashed var(--ac);border-radius:8px;cursor:pointer}
input:not([type]){font:inherit;padding:8px;width:11em;max-width:100%;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
label{display:block;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--card)}
#nav,#ft{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;max-width:760px;margin:0 auto}
#nav i{font-style:normal;width:32px;height:32px;line-height:30px;text-align:center;border:1px solid var(--bd);border-radius:6px;font-size:13px;background:var(--card)}
#nav i.a{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.rv{border-left:5px solid var(--bd);padding:8px 12px;margin:10px 0;background:var(--card)}
.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--no)}.rv.pt{border-color:#c98a00}
.rv p{margin:.4em 0 0;color:var(--mu)}
select{font:inherit;padding:8px;margin:8px 0}
</style></head><body><div id="app"></div>

/* ===== STATE (schema) =====
 T[n] = {parts:[{g:[{h,i,k:'g'|'c'|'m', it:[{n,t,o?,a:[..],x}]}]}]}  k: g=gap, c=single choice, m=choose two
 localStorage: ielts = running exam {n,st,sch,ans,left}; r<n> = finished result {ans,left,tot}
 IndexedDB ielts/a: key t<n>p<p> = audio Blob. Repo fallback: audio/tNN_pN.mp3 */

{g:[
{h:"Self-drive tours in the USA (Q1–6)",i:"Complete the notes. Write ONE WORD for each answer.",k:'g',ex:"Name: Andrea <u>Brown</u>",it:[
{n:1,t:"Address: 24 __ Road",a:["ardleigh"],x:"Spelled out letter by letter (A-R-D-L-E-I-G-H). Write exactly what is spelled."},
{n:2,t:"Heard about company from: __",a:["newspaper"],x:"Agent offers 'friend' and 'advert'. Caller says she read about them in the newspaper."},
{n:3,t:"Los Angeles: customer wants to visit some __ parks with her children",a:["theme"],x:"'plenty of time to visit some of the theme parks'. The gap needs a word before 'parks'."},
{n:4,t:"Yosemite Park: customer wants to stay in a lodge, not a __",a:["tent"],x:"'campsite' is said first, but the caller's own word is 'tent'. Wait for the caller."},
{n:5,t:"Trip Two: customer wants to see the __ on the way to Cambria",a:["castle"],x:"The caller says 'a really nice castle' before the agent names Hearst Castle."},
{n:6,t:"At San Diego, wants to spend time on the __",a:["beach","beaches"],x:"'That's good for beaches isn't it?' The zoo is offered, then rejected."}]},
{h:"Trip table (Q7–10)",i:"Complete the table. Write ONE WORD AND/OR A NUMBER for each answer.",k:'g',it:[
{n:7,t:"Trip One, total distance: __ km",a:["2020"],x:"Total is 2,020 km. 206 and 632 are the shortest and longest legs, not the total."},
{n:8,t:"Trip One includes accommodation, car, one __",a:["flight"],x:"'accommodation, car rental and a flight but no meals'."},
{n:9,t:"Trip Two, price per person: £ __",a:["429"],x:"'almost a hundred pounds cheaper' is only a hint. Wait for the exact figure, £429."},
{n:10,t:"Trip Two includes accommodation, car, __",a:["dinner"],x:"Flights are not included, then: 'these hotels offer dinner in the price'."}]}]},
{g:[
{h:"Leisure club facilities (Q11–12)",i:"Choose TWO letters, A–E.",k:'m',it:[
{n:11,t:"Which TWO facilities at the leisure club have recently been improved?",o:["the gym","the tracks","the indoor pool","the outdoor pool","the sports training for children"],a:["A","C"],x:"A: 'recently refurbished fitness suite'. C: pool 'expanded to eight lanes'. D is out: no space for an outdoor pool. E: tuition 'continues', so it is not new. B is never mentioned."}]},
{h:"Joining the leisure club (Q13–20)",i:"Complete the notes. Write NO MORE THAN TWO WORDS for each answer.",k:'g',it:[
{n:13,t:"New members should describe any __.",a:["health problems","health problem"],x:"'giving details of any health problems' on the day-one questionnaire."},
{n:14,t:"The __ will be explained to you before you use the equipment.",a:["safety rules","safety rule"],x:"'take you through the safety rules for using the equipment'."},
{n:15,t:"You will be given a six-week __.",a:["plan"],x:"'draw up a plan ... within a six-week period'. 'six-week' is already printed."},
{n:16,t:"There is a compulsory £90 __ fee for members.",a:["joining"],x:"'All members must pay a joining fee of £90'. Monthly fees are a separate cost."},
{n:17,t:"Gold members are given __ to all the LP clubs.",a:["free entry"],x:"'Gold membership entitles you to free entry at all LP Clubs'."},
{n:18,t:"Premier members are given priority during __ hours.",a:["peak"],x:"'booking preferences to Premier members at peak times'. 'hours' is already printed."},
{n:19,t:"Premier members can bring some __ every month.",a:["guests"],x:"'passes for guests every month'. The gap needs the noun 'guests', not 'passes'."},
{n:20,t:"Members should always take their __ with them.",a:["photo card","photo cards","photocard"],x:"'very important to remember your photo card'. Clothes and equipment are not needed."}]}]},
{g:[
{h:"Global Design Competition (Q21–25)",i:"Choose the correct letter, A, B or C.",k:'c',it:[
{n:21,t:"Students entering the design competition have to",o:["produce an energy-efficient design.","adapt an existing energy-saving appliance.","develop a new use for current technology."],a:["C"],x:"'a new design for a typical domestic kitchen appliance' is general. The answer: 'innovative approach to existing technology'. Energy saving was last year's focus."},
{n:22,t:"John chose a dishwasher because he wanted to make dishwashers",o:["more appealing.","more common.","more economical."],a:["A"],x:"'some people will be prepared to pay a little extra for something that looks different'."},
{n:23,t:"The stone in John's 'Rockpool' design is used",o:["for decoration.","to switch it on.","to stop water escaping."],a:["B"],x:"'Instead of pushing a button, you turn the stone'. The professor's 'decoration' is corrected."},
{n:24,t:"In the holding chamber, the carbon dioxide",o:["changes back to a gas.","dries the dishes.","is allowed to cool."],a:["A"],x:"'the liquid is depressurised and so it reverts to a gas'."},
{n:25,t:"At the end of the cleaning process, the carbon dioxide",o:["is released into the air.","is disposed of with the waste.","is collected ready to be re-used."],a:["C"],x:"'sent back to the cylinder and can be used again and again'. The professor's 'not wasted, I hope' invites A or B."}]},
{h:"John's needs (Q26–30)",i:"Complete the notes. Write ONE WORD ONLY for each answer.",k:'g',it:[
{n:26,t:"John needs help preparing for his __.",a:["presentation"],x:"'I have to give a presentation, and that's the part I was hoping you could help me with'. Drawings and paper are already done."},
{n:27,t:"The professor advises John to make a __ of his design.",a:["model"],x:"'you really need a model of the machine'."},
{n:28,t:"John's main problem is getting good quality __.",a:["material","materials"],x:"Main difficulty: materials. 'everything that's top quality is also very expensive'."},
{n:29,t:"The professor suggests John apply for a __.",a:["grant"],x:"'why don't you talk to the university about a grant?' Not 'application forms'."},
{n:30,t:"The professor will check the __ information in John's written report.",a:["technical"],x:"'make sure the technical details you've given are accurate and thorough'."}]}]},
{g:[{h:"The spirit bear (Q31–40)",i:"Complete the notes. Write ONE WORD ONLY for each answer.",k:'g',it:[
{n:31,t:"Its colour comes from an uncommon __.",a:["gene"],x:"'born with a white coat, which is the result of a special gene'."},
{n:32,t:"Local people believe that it has unusual __.",a:["power","powers"],x:"'its snowy fur brings with it a special power'. Singular or plural accepted."},
{n:33,t:"They protect the bear from __.",a:["strangers"],x:"'their way of protecting it when strangers visit the area'."},
{n:34,t:"Tree roots stop __ along salmon streams.",a:["erosion"],x:"'roots that help prevent erosion of the soil along the banks'."},
{n:35,t:"It is currently found on a small number of __.",a:["islands"],x:"'lives off the coast ... on a few islands'."},
{n:36,t:"Habitat is being lost due to deforestation and construction of __ by logging companies.",a:["roads"],x:"'they have built roads which have fractured the areas where the bear usually feeds'."},
{n:37,t:"Unrestricted __ is affecting the salmon supply.",a:["fishing"],x:"'no legal limit on fishing'. Salmon numbers fall because of it."},
{n:38,t:"The bears' existence is also threatened by their low rate of __.",a:["reproduction"],x:"'reproduction among these bears has always been disappointingly low'."},
{n:39,t:"Logging companies must improve their __ of logging.",a:["method","methods"],x:"'requiring logging companies to adopt a better logging method'."},
{n:40,t:"Maintenance and __ of the spirit bears' territory is needed.",a:["expansion"],x:"'more emphasis on its expansion'. 'Maintenance' is already printed."}]}]}
]},

{g:[{h:"Transport Survey (Q1–10)",i:"Complete the notes. Write ONE WORD AND/OR A NUMBER for each answer.",k:'g',ex:"Travelled to town today: by <u>bus</u>",it:[
{n:1,t:"Name: Luisa __",a:["hardie"],x:"Spelled out: H-A-R-D-I-E."},
{n:2,t:"Address: __ White Stone Rd",a:["19"],x:"'It's 19, White Stone Road.' Write the number only."},
{n:3,t:"Postcode: __",a:["gt8 2lc","gt82lc"],x:"The interviewer says GT7 and she corrects it: G-T-8, 2-L-C. Take the corrected version."},
{n:4,t:"Occupation: __",a:["hairdresser"],x:"The interviewer suggests 'student'. She says she has finished training: 'I'm a hairdresser'."},
{n:5,t:"Reason for visit to town: to go to the __",a:["dentist","dentist's","dentists"],x:"'not for shopping today ... but to see the dentist'. Shopping is the rejected usual reason."},
{n:6,t:"Suggestions for improvement: better __",a:["lighting"],x:"'the lighting should be better'. Footpaths come next but already have a printed answer."},
{n:7,t:"more frequent __",a:["trains"],x:"'I don't think there are enough trains'. Wait time is the reason; the gap needs the plural noun."},
{n:8,t:"Cycling to work: having __ parking places for bicycles",a:["safe"],x:"'there are no safe places to leave your bikes'. The gap before 'parking places' needs an adjective."},
{n:9,t:"being able to use a __ at work",a:["shower"],x:"'I think I'd need a shower somewhere at work'. Uphill and sweaty are only the reasons."},
{n:10,t:"the opportunity to have cycling __ on busy roads",a:["training"],x:"'I'd like to see you offering training for that'. 'Confident' is an adjective, so it doesn't fit."}]}]},
{g:[

{n:11,t:"The idea for the two new developments in the city came from",o:["local people.","the City Council.","the SWRDC."],a:["A"],x:"'the idea for these initiatives came from you, the public'. The Council ran the consultation and the SWRDC paid, which are the traps."},
{n:12,t:"What is unusual about Brackenside pool?",o:["its architectural style","its heating system","its method of water treatment"],a:["C"],x:"'a recycling system, the only one of its kind in the world, which enables seawater to be used'. The 1930s design is charming, not unusual."},

{n:14,t:"What decision has not yet been made about the pool?",o:["whose statue will be at the door","the exact opening times","who will open it"],a:["A"],x:"The public will 'decide on the sculpture' and choose the historical figure. Coral White is already chosen to open the pool."}]},
{h:"Playground areas (Q15–20)",i:"Which feature is related to each area of the world? Choose SIX answers from the box. Tap a feature, then tap a slot, or drag it. Each feature is used once.",k:'d',o:["ancient forts","waterways","ice and snow","jewels","local animals","mountains","music and film","space travel","volcanoes"],it:[

{g:[
{h:"Thor Heyerdahl: early life (Q21–24)",i:"Choose TWO letters, A–E, for each question.",k:'m',it:[
{n:21,t:"Which TWO hobbies was Thor Heyerdahl very interested in as a youth?",o:["camping","climbing","collecting","hunting","reading"],a:["B","C"],x:"C: 'his passion for collecting things'. B: Victor corrects camping with 'it was climbing'. Hunting was refused and reading was not a hobby."},
{n:23,t:"Which TWO reasons did Heyerdahl have for living on an island?",o:["to examine ancient carvings","to experience an isolated place","to formulate a new theory","to learn survival skills","to study the impact of an extreme environment"],a:["B","E"],x:"B: 'a remote location ... cut off by the sea'. E: 'how harsh weather conditions shaped people's lifestyles'. Survival skills were preparation only."}]},
{h:"The later life of Thor Heyerdahl (Q25–30)",i:"Choose the correct letter, A, B or C.",k:'c',it:[
{n:25,t:"According to Victor and Olivia, academics thought that Polynesian migration from the east was impossible due to",o:["the fact that Eastern countries were far away.","the lack of materials for boat building.","the direction of the winds and currents."],a:["A"],x:"'travel from the east was impossible, because of the huge, empty stretch of ocean'. Winds and currents were Heyerdahl's own research."},
{n:26,t:"Which do the speakers agree was the main reason for Heyerdahl's raft journey?",o:["to overcome a research setback","to demonstrate a personal quality","to test a new theory"],a:["C"],x:"'simply trying out his idea, to see if migration from the east was possible'. Victor's 'private reasons' idea is dropped."},
{n:27,t:"What was most important to Heyerdahl about his raft journey?",o:["the fact that he was the first person to do it","the speed of crossing the Pacific","the use of authentic construction methods"],a:["C"],x:"'only ancient techniques and local materials'. Being first: 'I haven't read anywhere that that was his motivation'."},
{n:28,t:"Why did Heyerdahl go to Easter Island?",o:["to build a stone statue","to sail a reed boat","to learn the local language"],a:["A"],x:"He talked to locals about stone carvings 'and then make one himself'. The reed boat was later, in Egypt."},
{n:29,t:"In Olivia's opinion, Heyerdahl's greatest influence was on",o:["theories about Polynesian origins.","the development of archaeological methodology.","establishing archaeology as an academic subject."],a:["B"],x:"'the first person to establish ... practical archaeology': recreating the past. His origin theories were discredited."},
{n:30,t:"Which criticism do the speakers make of William Oliver's textbook?",o:["Its style is out of date.","Its content is over-simplified.","Its methodology is flawed."],a:["A"],x:"'the overall tone somewhat old-fashioned'. The research methods were 'sound'."}]}]},
{g:[{h:"The future of management (Q31–40)",i:"Complete the notes. Write ONE WORD ONLY for each answer.",k:'g',it:[
{n:31,t:"Business markets: greater __ among companies",a:["competition"],x:"'a major increase in competition'."},
{n:32,t:"increase in power of large __ companies",a:["global"],x:"'governments are actually losing power to major global corporations'."},

{n:36,t:"Business structures: more teams will be formed to work on a particular __",a:["project"],x:"'teams created with a specific project in mind'."},

{n:40,t:"Changes in the economy: more and more __ workers",a:["self-employed","self employed","selfemployed"],x:"'more and more people are becoming self-employed'."}]}]}
]},

{g:[{h:"Early Learning Childcare Centre enrolment form (Q1–10)",i:"Complete the form. Write ONE WORD AND/OR A NUMBER for each answer.",k:'g',ex:"Parent or guardian: Carol <u>Smith</u>",it:[

{n:3,t:"Days enrolled for: Monday and __",a:["thursday"],x:"Wednesday is full and Friday has swimming. 'I suppose Thursday would be all right'."},
{n:4,t:"Start time: __ am",a:["8.30","8:30","8 30","830"],x:"She must be at work by 9:00, so 'I'll drop her off at 8:30'. The 7:30 opening time is the distractor."},

{n:11,t:"Which TWO things does Alice say about the Dolphin Conservation Trust?",o:["Children make up most of the membership.","It's the country's largest conservation organisation.","It helps finance campaigns for changes in fishing practices.","It employs several dolphin experts full-time.","Volunteers help in various ways."],a:["C","E"],x:"C: 'uses its money to support campaigns'. E: 'volunteers working in observation, office work'. A: only 35% are children. B: 'still fairly small'. D: it only 'hopes soon' to employ its first full-time biologist."}]},

{n:21,t:"What helped Rob to prepare to play the character of a doctor?",o:["the stories his grandfather told him","the times when he watched his grandfather working","the way he imagined his grandfather at work"],a:["C"],x:"'I'd visualise what he must have been like in the past'. His grandfather never says much about his work."},

const A=document.getElementById('app'),$=s=>document.querySelector(s),au=new Audio();
let run=JSON.parse(localStorage.ielts||'null'),pre=[],cur=-1,key='',view=0,rv=false,timer,own={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const norm=s=>String(s).toLowerCase().replace(/[£,]/g,'').replace(/[-\s]+/g,' ').trim();
const fmt=s=>{s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const save=()=>localStorage.ielts=JSON.stringify(run);
const path=(n,p)=>`audio/t${String(n).padStart(2,'0')}_p${p}.mp3`;
const flat=t=>t.parts.map(P=>P.g.flatMap(g=>g.it.map(i=>({...i,k:g.k}))));
const B=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4]];
const band=t=>(B.find(x=>t>=x[0])||[0,'below 4'])[1];

/* audio store */
const db=new Promise(r=>{try{const q=indexedDB.open('ielts',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idb(m,k,v){const d=await db;if(!d)return;return new Promise(r=>{const s=d.transaction('a',m=='get'?'readonly':'readwrite').objectStore('a'),q=m=='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
const probe=src=>new Promise(r=>{const a=new Audio(),f=v=>{clearTimeout(t);r(v)},t=setTimeout(()=>f(null),6000);a.preload='metadata';a.onloadedmetadata=()=>f(isFinite(a.duration)?a.duration:null);a.onerror=()=>f(null);a.src=src});
const prep=n=>Promise.all([1,2,3,4].map(async p=>{const b=await idb('get',`t${n}p${p}`);let s=b&&URL.createObjectURL(b),d=s&&await probe(s);if(!d){s=path(n,p);d=await probe(s)}return d?{s,d}:{s:null,d:450}}));

/* screens */
function home(){clearInterval(timer);let h=`<div class=w><div class=top><h1>IELTS Listening Practice</h1><span><button id=ins style="display:none" onclick="dip.prompt()">Install app</button> <button onclick=mgr()>Audio Manager</button></span></div><p><small>Install as an app: on iPhone tap Share, then Add to Home Screen. On Android or desktop use the Install button or the browser menu.</small></p><div class=grid>`;
for(let n=1;n<=40;n++){const r=JSON.parse(localStorage['r'+n]||'null');h+=T[n]?`<button class="c on" onclick="intro(${n})"><b>Test ${n}</b><small>${r?r.tot+'/40, last attempt':'Ready'}</small></button>`:`<div class=c><b>Test ${n}</b><small>Coming soon</small></div>`}
A.innerHTML=h+'</div></div>';if(dip)$('#ins').style.display=''}

async function intro(n){const r=localStorage['r'+n];
A.innerHTML=`<div class=w><h2>Test ${n}</h2><ul><li>4 parts, 40 questions. Audio plays once and cannot be paused or replayed.</li><li>The clock starts when you tap Start and cannot be stopped. Refreshing does not reset it.</li><li>After Part 4 you get 10 minutes to check your answers, then the test submits automatically.</li><li>Use headphones and stay on this page.</li></ul><p id=st>Checking audio...</p><button id=go disabled>Start exam</button> <button onclick=home() style="background:var(--mu)">Back</button> ${r?`<button onclick=review(${n})>Last review</button>`:''}</div>`;
pre=await prep(n);$('#st').textContent=pre.map((x,i)=>`Part ${i+1}: ${x.s?(x.s.startsWith('blob')?'audio ready (this browser only)':'audio ready (repo)'):'no audio (silent 7:30 timer)'}`).join(' | ');
const g=$('#go');g.disabled=false;g.onclick=()=>begin(n);const k=await saved(n);$('#st').insertAdjacentHTML('afterend',`<p><button id=dl>${k==4?'Saved for offline ✔':'Download for offline'}</button></p>`);$('#dl').onclick=()=>dl(n)}

function begin(n){run={n,st:Date.now(),sch:pre.map(x=>x.d),ans:{},left:0};save();
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
cur=0;au.src=pre[0].s||'';if(pre[0].s)au.play().catch(()=>{});loop()}

async function resume(){A.innerHTML=`<div class=w><h2>Test ${run.n} in progress</h2><p>The clock kept running while you were away. Tap to rejoin.</p><button id=go disabled>Resume</button></div>`;
pre=await prep(run.n);const g=$('#go');g.disabled=false;g.onclick=()=>{cur=-1;loop()}}

function loop(){own={};flat(T[run.n]).flat().forEach(it=>{if(it.k=='m'){own[it.n]=[it.n,0];own[it.n+1]=[it.n,1]}else own[it.n]=[it.n]});
A.innerHTML=`<div class=bar><span>Test ${run.n}</span><span id=ph></span><span id=tm></span></div><div class=w id=qs></div><div id=nav></div><div id=ft></div>`;
key='';view=0;clearInterval(timer);timer=setInterval(tick,500);tick()}

function tick(){const S=run.sch,e=(Date.now()-run.st)/1e3,Z=S[0]+S[1]+S[2]+S[3],L=Z+600-e;
if(L<=0)return finish();
let p=0,c=0;while(p<3&&e>=c+S[p])c+=S[p++];
rv=e>=Z;const P=pre[p]||{},tp=e-c;
if(rv)au.pause();
else if(p!==cur){cur=p;au.src=P.s||'';if(P.s)au.onloadedmetadata=()=>{au.currentTime=Math.max(0,e-c);au.play().catch(()=>{})}}
else if(P.s&&!au.ended){if(au.readyState>1&&Math.abs(au.currentTime-tp)>3)au.currentTime=tp;if(au.paused&&au.readyState>1)au.play().catch(()=>{})}
const k=rv?'r':'a'+p;
if(k!=key){key=k;view=rv?0:p;$('#ft').innerHTML=rv?[0,1,2,3].map(i=>`<button onclick="jump(${i*10})">Part ${i+1}</button>`).join('')+'<button onclick=submit() style="background:var(--no)">Submit</button>':'';draw(view);navd()}
$('#ph').textContent=rv?'Review: check answers':`Part ${p+1} of 4${P.s?'':' (no audio)'}`;
$('#tm').textContent=fmt(L)}

function draw(i){pick=null;const gs=T[run.n].parts[i].g;
$('#qs').innerHTML=`<h2>Part ${i+1}</h2>`+gs.map(g=>`<h4>${g.h}</h4><p><i>${g.i}</i></p>${g.k=='d'?box(g):''}${g.ex?`<div class=q><i>Example:</i> ${g.ex}</div>`:''}`+g.it.map(it=>qi(it,g.k)).join('')).join('')+`<div class=pn>${i>0?'<button onclick=go(-1)>Previous</button>':'<span></span>'}${i<3?'<button onclick=go(1)>Next</button>':'<span></span>'}</div>`}
function go(d){view=Math.max(0,Math.min(3,view+d));draw(view);scrollTo(0,0)}

function qi(it,k){const v=run.ans[it.n];
if(k=='g')return `<div class=q><b>${it.n}</b> ${it.t.replace('__',`<input data-n=${it.n} value="${esc(v||'')}" autocomplete=off autocapitalize=none autocorrect=off spellcheck=false>`)}</div>`;
if(k=='d')return `<div class=q><b>${it.n}</b> ${it.t}<span class=slot data-n=${it.n}>${v||'tap to place'}</span></div>`;
return `<div class=q><b>${k=='m'?it.n+'–'+(it.n+1):it.n}</b> ${it.t}${it.o.map((o,j)=>{const L='ABCDE'[j];return `<label><input type=${k=='m'?'checkbox':'radio'} name=q${it.n} data-n=${it.n} value=${L} ${[].concat(v||[]).includes(L)?'checked':''}> <b>${L}</b> ${o}</label>`}).join('')}</div>`}

let pick=null;
const box=g=>`<div>${g.o.map((o,j)=>{const L='ABCDEFGHI'[j];return `<span class="chip${!g.re&&g.it.some(i=>run.ans[i.n]===L)?' used':''}" draggable=true data-l=${L}><b>${L}</b> ${o}</span>`}).join('')}</div>`;
function place(n,l){const g=T[run.n].parts[view].g.find(g=>g.k=='d'&&g.it.some(i=>i.n==n));if(!g||!l)return;
if(!g.re)g.it.forEach(i=>{if(run.ans[i.n]===l)delete run.ans[i.n]});run.ans[n]=l;save();draw(view);navd()}
A.addEventListener('click',e=>{if(!run)return;const c=e.target.closest('.chip'),s=e.target.closest('.slot');
if(c){pick=pick==c.dataset.l?null:c.dataset.l;document.querySelectorAll('.chip').forEach(x=>{x.style.outline=x.dataset.l==pick?'3px solid var(--ac)':''})}
else if(s){const n=s.dataset.n;if(pick)place(n,pick);else if(run.ans[n]){delete run.ans[n];save();draw(view);navd()}}});
A.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c)e.dataTransfer.setData('text/plain',c.dataset.l)});
A.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
A.addEventListener('drop',e=>{const s=e.target.closest&&e.target.closest('.slot');if(s&&run){e.preventDefault();place(s.dataset.n,e.dataTransfer.getData('text/plain'))}});
const has=x=>{const o=own[x];if(!o)return false;const v=run.ans[o[0]];return o.length>1?!!v&&v.length>o[1]:!!v&&String(v).trim()!==''};
function navd(){$('#nav').innerHTML=[...Array(40)].map((_,i)=>`<i class="${has(i+1)?'a':''}" onclick="jump(${i})">${i+1}</i>`).join('')}
function jump(i){view=Math.floor(i/10);draw(view)}

A.addEventListener('input',e=>{const t=e.target,n=t.dataset.n;if(!run||!n)return;
if(t.type=='checkbox'){const c=[...A.querySelectorAll(`[name=q${n}]:checked`)];if(c.length>2){t.checked=false;return}run.ans[n]=c.map(x=>x.value)}else run.ans[n]=t.value;
save();navd()});
addEventListener('beforeunload',e=>{if(run){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run){run.left++;save()}});

function submit(){if(confirm('Submit now? You cannot change answers afterwards.'))finish()}
function finish(){clearInterval(timer);au.pause();if(!run)return;const n=run.n,r={ans:run.ans,left:run.left,tot:score(n,run.ans).t};
localStorage['r'+n]=JSON.stringify(r);localStorage.removeItem('ielts');run=null;review(n)}

/* scoring */
function mark(it,v){if(it.k=='g')return +(v!=null&&it.a.includes(norm(v)));if(it.k=='c'||it.k=='d')return +(v===it.a[0]);return[].concat(v||[]).filter(x=>it.a.includes(x)).length}
function score(n,ans){const p=flat(T[n]).map(P=>P.reduce((s,it)=>s+mark(it,ans[it.n]),0));return{p,t:p.reduce((a,b)=>a+b,0)}}

/* review / answers and strategies */
function review(n){const r=JSON.parse(localStorage['r'+n]),s=score(n,r.ans);
let h=`<div class=w><h2>Test ${n}: ${s.t}/40 (about Band ${band(s.t)})</h2><p>${s.p.map((x,i)=>`Part ${i+1}: ${x}/10`).join(' | ')}</p>`;
if(r.left)h+=`<p style="color:var(--no)">You left the page ${r.left} time(s) during the test.</p>`;
flat(T[n]).forEach((P,i)=>{h+=`<h3>Part ${i+1}: ${s.p[i]}/10</h3>`;P.forEach(it=>{const v=r.ans[it.n],m=mark(it,v),mx=it.k=='m'?2:1,y=[].concat(v==null?[]:v).join(', ');
h+=`<div class="rv ${m==mx?'ok':m?'pt':'no'}"><b>${it.k=='m'?it.n+'–'+(it.n+1):it.n}</b> ${m}/${mx}<br>Your answer: ${y?esc(y):'(blank)'}<br>Correct: <b>${it.a.join(it.k=='m'?' and ':' / ')}</b><p>${it.x}</p></div>`})});
A.innerHTML=h+'<button onclick=home()>Home</button></div>';scrollTo(0,0)}

/* audio manager */
async function mgr(n=1){try{navigator.storage.persist()}catch(e){}A.innerHTML=`<div class=w><h2>Audio Manager</h2><p>Uploads are stored in this browser only. For students, commit MP3s to the repo, for example <code>audio/t01_p1.mp3</code> (test 01, part 1). Stored files take priority over repo files.</p><select id=sel onchange="mgr(+this.value)">${[...Array(40)].map((_,i)=>`<option ${i+1==n?'selected':''}>${i+1}</option>`).join('')}</select><div id=rows></div><button onclick=home()>Back</button></div>`;
let r='';for(let p=1;p<=4;p++){const b=await idb('get',`t${n}p${p}`);r+=`<p><b>Part ${p}</b>: ${b?'stored, '+(b.size/1e6).toFixed(1)+' MB':'nothing stored'}<br><small>Repo path: ${path(n,p)}</small><br><input type=file accept="audio/*" onchange="up(${n},${p},this.files[0])"></p>`}
$('#rows').innerHTML=r}
async function up(n,p,f){if(f){await idb('put',`t${n}p${p}`,f);mgr(n)}}

/* offline + install */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=$('#ins');if(b)b.style.display=''});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const aurl=(n,p)=>new URL(path(n,p),location.href).href;

for(let p=1;p<=4;p++){b.textContent=`Downloading part ${p} of 4...`;const u=aurl(n,p);if(await c.match(u))continue;const r=await fetch(u);if(!r.ok)throw 0;await c.put(u,r)}
b.textContent='Saved for offline ✔'}catch(e){b.textContent='Download failed. Tap to retry';b.disabled=false}}
run?resume():home();
</script></body></html>
